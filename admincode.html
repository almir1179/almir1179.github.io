<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Hour Admin Dashboard (UTC)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c3e50; color: white; padding: 20px; text-align: center; }
        .container { max-width: 650px; background: #34495e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin: 0 auto; }
        h2 { color: #1abc9c; margin-bottom: 5px; }
        p { color: #bdc3c7; font-size: 14px; margin-bottom: 25px; }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #2c3e50; border-radius: 8px; overflow: hidden; }
        .history-table th, .history-table td { padding: 12px; text-align: center; border-bottom: 1px solid #34495e; }
        .history-table th { background-color: #16a085; color: white; font-weight: bold; }
        .history-table tr:hover { background-color: #34495e; }
        .code-text { font-family: monospace; font-size: 18px; font-weight: bold; color: #2ecc71; background: #1a252f; padding: 4px 10px; border-radius: 4px; border: 1px dashed #2ecc71; }
        .time-text { font-size: 14px; color: #f1c40f; font-weight: bold; }
        .current-row { background-color: #27ae60 !important; }
        .current-row .code-text { color: #fff; border-color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 3-Hour Pcode Monitor (2 Days History)</h2>
    <p>All time windows below are displayed in UTC. Covers 48 hours for retro-verification.</p>
    
    <table class="history-table">
        <thead>
            <tr>
                <th>3-Hour Time Window (UTC Time)</th>
                <th>Valid Secret Code</th>
            </tr>
        </thead>
        <tbody id="historyBody">
        </tbody>
    </table>
</div>

<script>
    const SECRET_SALT = "MY_3HOUR_LOCK_888";

    function generatePcodeForBlock(targetDate) {
        const year = targetDate.getUTCFullYear();
        const month = targetDate.getUTCMonth() + 1; 
        const day = targetDate.getUTCDate();
        const hour = targetDate.getUTCHours(); 
        const timeBlock = Math.floor(hour / 3); 

        const rawString = `${year}-${month}-${day}-${timeBlock}-${SECRET_SALT}`;
        const hash = btoa(rawString).replace(/[^a-zA-Z0-9]/g, '');
        return "P-" + hash.substring(0, 8).toUpperCase();
    }

    function formatBlockTimeUTC(targetDate) {
        const hour = targetDate.getUTCHours(); 
        const blockNumber = Math.floor(hour / 3);
        
        const startHour = blockNumber * 3;
        const endHour = startHour + 2;
        
        const formatAmPm = (h) => {
            const ampm = h >= 12 ? 'PM' : 'AM';
            let displayH = h % 12;
            displayH = displayH ? displayH : 12;
            return `${displayH}:00 ${ampm}`;
        };

        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const dayLabel = `${months[targetDate.getUTCMonth()]} ${targetDate.getUTCDate()}`;
        
        return `${dayLabel} (${formatAmPm(startHour)} to ${formatAmPm(endHour)}:59 UTC)`;
    }

    const tbody = document.getElementById('historyBody');
    const now = new Date();

    // 🛠️ توليد آخر 16 فترة زمنية تراجعياً (16 فترة * 3 ساعات = 48 ساعة كاملة / يومين)
    for (let i = 0; i < 16; i++) {
        const loopDate = new Date(now.getTime() - (i * 3 * 60 * 60 * 1000));
        
        const code = generatePcodeForBlock(loopDate);
        const timeRange = formatBlockTimeUTC(loopDate);
        
        const row = document.createElement('tr');
        if (i === 0) row.className = 'current-row';
        
        row.innerHTML = `
            <td class="time-text">${i === 0 ? "🔥 ACTIVE NOW (" + timeRange + ")" : timeRange}</td>
            <td><span class="code-text">${code}</span></td>
        `;
        tbody.appendChild(row);
    }
</script>

</body>
</html>
