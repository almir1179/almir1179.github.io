<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Admin Dashboard - 24H History</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c3e50; color: white; padding: 20px; text-align: center; }
        .container { max-width: 650px; background: #34495e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin: 0 auto; }
        h2 { margin-bottom: 5px; color: #1abc9c; }
        p { color: #bdc3c7; font-size: 14px; margin-bottom: 25px; }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #2c3e50; border-radius: 8px; overflow: hidden; }
        .history-table th, .history-table td { padding: 12px; text-align: center; border-bottom: 1px solid #34495e; }
        .history-table th { background-color: #16a085; color: white; font-weight: bold; }
        .history-table tr:hover { background-color: #34495e; }
        .code-text { font-family: monospace; font-size: 18px; font-weight: bold; color: #2ecc71; background: #1a252f; padding: 4px 10px; border-radius: 4px; border: 1px dashed #2ecc71; }
        .time-text { font-size: 14px; color: #f1c40f; font-weight: bold; }
        .current-row { background-color: #27ae60 !important; }
        .current-row .code-text { color: #fff; border-color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 24-Hour Pcode History</h2>
    <p>Check the table below to verify codes submitted by workers within the last 24 hours.</p>
    
    <table class="history-table">
        <thead>
            <tr>
                <th>Time Window (Your Local Time)</th>
                <th>Valid Secret Code</th>
            </tr>
        </thead>
        <tbody id="historyBody">
            <!-- Codes will be generated here automatically -->
        </tbody>
    </table>
</div>

<script>
    // يجب أن تطابق هذه الكلمة ملف code.html تماماً
    const SECRET_SALT = "MY_FINAL_LOCK_999";

    function generatePcodeForTime(baseDate, offsetMinutes) {
        const targetDate = new Date(baseDate.getTime() + (offsetMinutes * 60 * 1000));
        
        const year = targetDate.getUTCFullYear();
        const month = targetDate.getUTCMonth();
        const day = targetDate.getUTCDate();
        const hour = targetDate.getUTCHours();
        const block = Math.floor(targetDate.getUTCMinutes() / 30); 

        const rawString = `${year}-${month}-${day}-${hour}-${block}-${SECRET_SALT}`;
        const hash = btoa(rawString).replace(/[^a-zA-Z0-9]/g, '');
        return "P-" + hash.substring(hash.length - 8).toUpperCase();
    }

    function formatLockerTime(baseDate, offsetMinutes) {
        const start = new Date(baseDate.getTime() + (offsetMinutes * 60 * 1000));
        
        // ضبط الدقائق لتوضيح بداية ونهاية النصف ساعة
        const startMin = start.getMinutes() < 30 ? "00" : "30";
        const endMin = start.getMinutes() < 30 ? "29" : "59";
        
        // تحويل الساعة لصيغة 12 ساعة (AM/PM) مريحة لعينيك
        let hours = start.getHours();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12; // الساعة 0 تصبح 12
        
        return `${hours}:${startMin} ${ampm} to ${hours}:${endMin} ${ampm}`;
    }

    const tbody = document.getElementById('historyBody');
    const now = new Date();

    // توليد الأكواد لـ 48 كتلة زمنية سابقة (48 * 30 دقيقة = 24 ساعة كاملة)
    for (let i = 0; i < 48; i++) {
        const offset = -i * 30; // الرجوع للخلف بـ 30 دقيقة في كل لفة
        
        const code = generatePcodeForTime(now, offset);
        const timeRange = formatLockerTime(now, offset);
        
        const row = document.createElement('tr');
        if (i === 0) row.className = 'current-row'; // تمييز النصف ساعة الحالية باللون الأخضر
        
        row.innerHTML = `
            <td class="time-text">${i === 0 ? "🔥 NOW (" + timeRange + ")" : timeRange}</td>
            <td><span class="code-text">${code}</span></td>
        `;
        tbody.appendChild(row);
    }
</script>

</body>
</html>
