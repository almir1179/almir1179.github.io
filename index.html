<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NC LIQUIDITY SERVICES LLC | Performance Marketing & Technology</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; line-height: 1.6; }
        
        /* تحسين الهيدر: تم تعديل تباين الجملة لتكون بيضاء واضحة بستايل عصري */
        header { 
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); 
            color: #fff; 
            padding: 60px 20px; 
            text-align: center; 
        }
        header h1 { font-size: 2.5rem; margin-bottom: 12px; letter-spacing: 1.5px; font-weight: 700; }
        
        /* تعديل موضوعي: اللون #ffffff للوضوح العالي، زيادة الحجم، إضافة opcity */
        header p { 
            font-size: 1.25rem; 
            color: #ffffff !important; 
            font-weight: 400;
            opacity: 0.95;
            letter-spacing: 0.5px;
            max-width: 700px;
            margin: 0 auto;
        }
        
        .container { max-width: 800px; margin: 40px auto; padding: 30px; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #203a43; margin-bottom: 15px; font-size: 1.4rem; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        p { margin-bottom: 15px; font-size: 0.95rem; color: #555; text-align: justify; }
        .services-list { list-style: none; margin: 20px 0; }
        .services-list li { padding: 12px 15px; background: #f9f9f9; border-left: 4px solid #2c5364; margin-bottom: 10px; font-size: 0.95rem; font-weight: 500; }
        
        footer { background: #111; color: #fff; padding: 40px 20px; text-align: center; font-size: 0.85rem; margin-top: 60px; }
        footer .address { color: #aaa; font-style: normal; display: block; margin: 15px 0; font-size: 0.8rem; }
    </style>
</head>
<body>
    <header>
        <h1>NC LIQUIDITY SERVICES LLC</h1>
        <p>Advanced Technology Solutions & Performance Marketing Agency</p>
    </header>
    <div class="container">
        <h2>About Our Agency</h2>
        <p>NC LIQUIDITY SERVICES LLC is a registered corporate entity in the State of New Mexico, specializing in high-performance digital marketing, data engineering, and media buying solutions.</p>
    </div>
</body>
</html>
