  h1 { color: #00ff88; }
  #timer { font-size: 48px; font-weight: bold; color: #00ff88; }
  .btn { display: inline-block; margin-top: 20px; padding: 15px 30px; background: #00ff88; color: #000; text-decoration: none; border-radius: 8px; font-weight: bold; }

<script>
  let timeLeft = 3;
  function countdown() {
    document.getElementById("timer").innerText = timeLeft;
    if(timeLeft <= 0){
      window.location.href = "https://singingfiles.com/";
    } else {
      timeLeft--;
      setTimeout(countdown, 1000);
    }
  }
  window.onload = countdown;
</script>
