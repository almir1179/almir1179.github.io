<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations! Your Secret Code</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f7f6; padding: 50px; }
        .container { max-width: 500px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: 0 auto; }
        h2 { color: #28a745; }
        .pcode-box { background: #e9ecef; border: 2px dashed #28a745; padding: 15px; font-size: 24px; font-weight: bold; color: #155724; letter-spacing: 2px; margin: 20px 0; border-radius: 5px; display: inline-block; width: 80%; }
        p { color: #6c757d; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Thank You! Verification Successful 🎉</h2>
    <p>Copy the secret code below and paste it into SproutGigs. Remember to take a FULL screenshot of this page without cropping!</p>
    
    <div class="pcode-box">
        <span id="pcodeValue">------</span>
    </div>
    
    <p>Note: This code changes automatically every 3 hours for maximum security (UTC Based).</p>
</div>

<script>
    const SECRET_SALT = "MY_3HOUR_LOCK_888";

    function generate3HourPcode() {
        const now = new Date();
        const year = now.getUTCFullYear();
        const month = now.getUTCMonth() + 1; 
        const day = now.getUTCDate();
        const hour = now.getUTCHours(); 
        
        // 🛠️ تقسيم اليوم إلى 8 فترات (كل فترة 3 ساعات) بناءً على التوقيت العالمي
        const timeBlock = Math.floor(hour / 3); 

        const rawString = `${year}-${month}-${day}-${timeBlock}-${SECRET_SALT}`;
        const hash = btoa(rawString).replace(/[^a-zA-Z0-9]/g, '');
        return "P-" + hash.substring(0, 8).toUpperCase();
    }

    document.getElementById('pcodeValue').innerText = generate3HourPcode();
</script>

</body>
</html>
