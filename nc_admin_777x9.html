<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>48-Hour CPA Admin Dashboard (UTC)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c3e50; color: white; padding: 20px; text-align: center; }
        .container { max-width: 750px; background: #34495e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin: 0 auto; }
        h2 { color: #1abc9c; margin-bottom: 5px; }
        p { color: #bdc3c7; font-size: 14px; margin-bottom: 25px; }
        .table-wrapper { max-height: 600px; overflow-y: auto; border-radius: 8px; border: 1px solid #16a085; }
        .history-table { width: 100%; border-collapse: collapse; background: #2c3e50; }
        .history-table th, .history-table td { padding: 12px; text-align: center; border-bottom: 1px solid #34495e; }
        .history-table th { background-color: #16a085; color: white; font-weight: bold; position: sticky; top: 0; z-index: 10; }
        .history-table tr:hover { background-color: #3d566e; }
        .code-container { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .code-text { font-family: monospace; font-size: 18px; font-weight: bold; color: #2ecc71; background: #1a252f; padding: 4px 10px; border-radius: 4px; border: 1px dashed #2ecc71; }
        .copy-btn { background: #1abc9c; border: none; color: white; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: background 0.2s; }
        .copy-btn:hover { background: #16a085; }
        .time-text { font-size: 14px; color: #f1c40f; font-weight: bold; }
        .current-row { background-color: #27ae60 !important; }
        .current-row .code-text { color: #fff; border-color: #fff; }
        .current-row .copy-btn { background: #fff; color: #27ae60; }
        .current-row .copy-btn:hover { background: #e8f8f5; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 48-Hour Pcode Monitor (UTC Based)</h2>
    <p>Displays all generated codes for the last 48 hours to easily verify older proofs.</p>
    
    <div class="table-wrapper">
        <table class="history-table">
            <thead>
                <tr>
                    <th>Hourly Time Window (UTC Time)</th>
                    <th>Valid Secret Code</th>
                </tr>
            </thead>
            <tbody id="historyBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    const SECRET_SALT = "MY_6HOUR_LOCK_777";

    function hashCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = (hash << 5) - hash + str.charCodeAt(i);
            hash |= 0; 
        }
        return Math.abs(hash).toString(36).toUpperCase();
    }

    function generatePcodeForBlock(targetDate) {
        const year = targetDate.getUTCFullYear();
        const month = targetDate.getUTCMonth() + 1; 
        const day = targetDate.getUTCDate();
        const hour = targetDate.getUTCHours(); 
        const timeBlock = hour; 

        const rawString = `${year}-${month}-${day}-${timeBlock}-${SECRET_SALT}`;
        return "P-" + hashCode(rawString).padStart(8, 'X');
    }

    function formatBlockTimeUTC(targetDate) {
        const hour = targetDate.getUTCHours(); 
        
        const formatAmPm = (h) => {
            const ampm = h >= 12 ? 'PM' : 'AM';
            let displayH = h % 12;
            displayH = displayH ? displayH : 12;
            return `${displayH}:00 ${ampm}`;
        };

        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const dayLabel = `${months[targetDate.getUTCMonth()]} ${targetDate.getUTCDate()}`;
        
        return `${dayLabel} (${formatAmPm(hour)} to ${formatAmPm(hour)}:59 UTC)`;
    }

    function copyToClipboard(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            const originalText = btn.innerText;
            btn.innerText = "COPIED!";
            setTimeout(() => btn.innerText = originalText, 1500);
        });
    }

    function renderDashboard() {
        const tbody = document.getElementById('historyBody');
        tbody.innerHTML = ""; 
        const now = new Date();

        // Loop changed to 48 to store the last 48 hourly codes
        for (let i = 0; i < 48; i++) {
            const loopDate = new Date(now.getTime() - (i * 60 * 60 * 1000)); 
            const code = generatePcodeForBlock(loopDate);
            const timeRange = formatBlockTimeUTC(loopDate);
            
            const row = document.createElement('tr');
            if (i === 0) row.className = 'current-row';
            
            row.innerHTML = `
                <td class="time-text">${i === 0 ? "🔥 ACTIVE NOW (" + timeRange + ")" : timeRange}</td>
                <td>
                    <div class="code-container">
                        <span class="code-text">${code}</span>
                        <button class="copy-btn" onclick="copyToClipboard('${code}', this)">COPY</button>
                    </div>
                </td>
            `;
            tbody.appendChild(row);
        }
    }

    renderDashboard();
    setInterval(renderDashboard, 60000);
</script>

</body>
</html>
