<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Google Play Verifizierung</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0b0f14;
font-family:Arial,Helvetica,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:15px;
}

.wrapper{
width:100%;
max-width:450px;
background:#1a648c;
min-height:100vh;
display:flex;
flex-direction:column;
}

header{
background:#111;
padding:15px;
text-align:center;
}

header h1{
color:#fff;
font-size:18px;
font-weight:bold;
}

main{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:40px 20px;
text-align:center;
}

.text{
color:#fff;
font-size:30px;
font-weight:bold;
line-height:1.4;
}

.highlight{
color:#facc15;
text-shadow:0 0 10px #facc15;
}

.pointer{
font-size:58px;
margin:25px 0;
animation:bounce 1.2s infinite;
}

@keyframes bounce{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(10px);
}
}

.button{
display:inline-block;
background:#22c55e;
color:#fff;
text-decoration:none;
font-size:20px;
font-weight:bold;
padding:18px 42px;
border-radius:50px;
box-shadow:0 10px 20px rgba(0,0,0,.35);
transition:.15s;
}

.button:active{
transform:scale(.98);
}

@media(max-width:380px){

.text{
font-size:26px;
}

.button{
font-size:18px;
padding:16px 34px;
}

}
</style>

</head>

<body>

<div class="wrapper">

<header>
<h1>Google Play Verifizierung</h1>
</header>

<main>

<div class="text">
Jetzt App<br>
herunterladen.<br>
<span class="highlight">KEINE Identitätsprüfung</span><br>
und KEINE Registrierung<br>
erforderlich!<br>
Einfach installieren<br>
und 30–60 Sekunden<br>
geöffnet lassen.
</div>

<div class="pointer">👇</div>

<a class="button"
href="https://singingfiles.com/show.php?l=0&u=145230&id=72905"
target="_blank"
rel="noopener noreferrer">
ZUM PLAY STORE
</a>

</main>

</div>

</body>
</html>
