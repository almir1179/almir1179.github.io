<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Google Play Verifizierung</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    font-family:Arial, Helvetica, sans-serif;
    background:#0b0f14;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.wrapper{
    width:100%;
    max-width:450px;
    min-height:100vh;
    background:#1a648c;
    display:flex;
    flex-direction:column;
}

header{
    background:#111111;
    padding:15px 20px;
    text-align:center;
}

header h1{
    color:#fff;
    font-size:18px;
    font-weight:700;
}

main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:center;
    text-align:center;
    padding:40px 20px;
}

.text{
    color:#fff;
    font-size:30px;
    line-height:1.4;
    font-weight:700;
}

.highlight{
    color:#facc15;
    text-shadow:
        0 0 8px rgba(250,204,21,.8),
        0 0 18px rgba(250,204,21,.5);
}

.pointer{
    font-size:58px;
    margin:28px 0;
    animation:bounce 1.2s ease-in-out infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(10px);
    }
}

.button{
    display:inline-block;
    padding:18px 40px;
    border-radius:50px;
    background:#22c55e;
    color:#fff;
    font-size:20px;
    font-weight:700;
    text-decoration:none;
    box-shadow:0 10px 22px rgba(0,0,0,.30);
    transition:transform .15s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color:transparent;
}

.button:hover{
    box-shadow:0 12px 24px rgba(0,0,0,.35);
}

.button:active{
    transform:scale(.98);
}

@media (max-width:380px){

.text{
    font-size:26px;
}

.button{
    font-size:18px;
    padding:16px 34px;
}

.pointer{
    font-size:50px;
}

}
</style>

</head>
<body>

<div class="wrapper">

<header>
<h1>Google Play Verifizierung</h1>
</header>

<main>

<div class="text">
Jetzt App<br>
herunterladen.<br>
<span class="highlight">KEINE Identitätsprüfung</span><br>
und KEINE Registrierung<br>
erforderlich!<br>
Einfach installieren<br>
und 30–60 Sekunden<br>
geöffnet lassen.
</div>

<div class="pointer">👇</div>

<!-- تم ربط الزر برابط عرضك الخاص الموثق من حسابك مباشرة لضمان احتساب الأرباح -->
<a href="https://singingfiles.com" class="button">
ZUM PLAY STORE
</a>

</main>

</div>

</body>
</html>
