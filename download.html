<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download App</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0f172a; /* خلفية داكنة معاصرة تمنع تشتت العامل */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    padding: 20px;
    overflow: hidden;
}

.wrapper {
    text-align: center;
    max-width: 400px;
    width: 100%;
}

h1 {
    font-size: 34px;
    color: #ffffff; /* نص أبيض ناصع بارز */
    margin-bottom: 8px;
    font-weight: 900;
    letter-spacing: -0.5px;
}

p {
    color: #94a3b8; /* لون رمادي خفيف ونظيف */
    font-size: 16px;
    margin-bottom: 35px;
}

/* سهم تنزيل كلاسيكي عملاق مع تأثير نبض وإشعاع النيون الأخضر */
.glow-arrow {
    font-size: 120px; /* حجم عملاق مسيطر بصرياً */
    line-height: 1;
    margin-bottom: 35px;
    display: inline-block;
    color: #22c55e; /* لون أخضر فوسفوري صريح */
    animation: pulseVertical 1s infinite ease-in-out;
    filter: drop-shadow(0 0 25px rgba(34, 197, 94, 0.6)); /* إشعاع نيون قوي خلف السهم */
    font-weight: 900;
}

@keyframes pulseVertical {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-15px) scale(1.05); }
}

/* زر التحميل العريض الفاخر باللون الأخضر الدائري */
.btn-google-play {
    display: block;
    background: #22c55e; /* أخضر فوسفوري جذاب جداً للنقر */
    color: #ffffff;
    text-decoration: none;
    padding: 22px;
    border-radius: 50px; /* زوايا دائرية بالكامل لأسلوب معاصر */
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.5px;
    box-shadow: 0 10px 30px rgba(34, 197, 94, 0.4);
    transition: all 0.2s ease;
    text-transform: uppercase;
}

.btn-google-play:hover {
    background: #16a34a;
    box-shadow: 0 12px 35px rgba(22, 163, 74, 0.6);
    transform: translateY(-2px);
}

.btn-google-play:active {
    transform: translateY(1px);
}

.footer-text {
    margin-top: 30px;
    font-size: 14px;
    color: #64748b;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- عنوان تكنولوجي نظيف وموجز -->
    <h1>GOOGLE PLAY</h1>
    <p>Klicken Sie unten, um die App direkt zu installieren.</p>

    <!-- سهم التنزيل المشع العملاق -->
    <div class="glow-arrow">⬇</div>

    <!-- زر النقر مدمج به رابط عرض الأندرويد الألماني الخاص بك مباشرة -->
    <a class="btn-google-play" 
       href="https://singingfiles.com" 
       target="_blank" 
       rel="noopener noreferrer">
        ZUM GOOGLE PLAY STORE
    </a>

    <div class="footer-text">
        🔒 Offizieller & Sicherer Download
    </div>

</div>

</body>
</html>
